security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        oauth:
            pattern: ^/auth
            security: false

        admin:
            pattern: ^/admin
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin
                always_use_default_target_path: true
                username_parameter: email
                password_parameter: password
            logout:
                path: admin_logout
                target: admin_login

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        register:
            pattern: ^/api/register
            security: false

        password_reset:
            pattern: ^/api/(forgot|reset)-password
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/admin/login,             roles: PUBLIC_ACCESS }
        - { path: ^/admin,                   roles: ROLE_ADMIN }
        - { path: ^/auth,                    roles: PUBLIC_ACCESS }
        - { path: ^/api/login,               roles: PUBLIC_ACCESS }
        - { path: ^/api/register,            roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password,     roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password,      roles: PUBLIC_ACCESS }
        - { path: ^/api/docs,                roles: PUBLIC_ACCESS }
        - { path: ^/api/translate,           roles: PUBLIC_ACCESS }
        - { path: ^/api/tutorials/\d+/view,  roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api,                     roles: IS_AUTHENTICATED_FULLY, methods: [POST, PUT, PATCH, DELETE] }
        - { path: ^/api,                     roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
